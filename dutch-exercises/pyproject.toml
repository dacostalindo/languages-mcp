[project]
name = "dutch-exercises"
version = "0.1.0"
description = "MCP server that finds high-quality Dutch (NT2) learning exercises for a theme and CEFR level."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dutch-exercises-mcp = "dutch_exercises.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dutch_exercises*"]

[tool.setuptools.package-data]
dutch_exercises = ["data/*.json", "ui_dist/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
